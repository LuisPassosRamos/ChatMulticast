name: Multicast chat

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - name: Exchange messages between two clients
        run: |
          docker compose up --build --detach --scale client=2
          for attempt in {1..20}; do
            if docker compose exec -T server python -c '
          import json
          with open("replica_server.json") as replica:
              messages = json.load(replica)
          assert len(messages) == 2
          assert len({message["sender"] for message in messages}) == 2
          ' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Shut down lab
        if: always()
        run: docker compose down
